<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Governance Assessment</title>
<style>
:root {
  --navy: #253B49;
  --steel: #6287A7;
  --blue: #008EFF;
  --violet: #6C6CD0;
  --bg: #F5F5F7;
  --card: #FFFFFF;
  --hair: #E2E6EE;
  --green: #0FB575;
  --red: #D93D3D;
  --blue-tint: rgba(0,142,255,0.10);
  --steel-tint: rgba(98,135,167,0.14);
  --green-tint: rgba(15,181,117,0.12);
  --shadow: 0 2px 12px rgba(37,59,73,0.08);
  --shadow-hover: 0 8px 28px rgba(37,59,73,0.12);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--navy);
  font-family: Protipo, Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-weight: 400;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font-family: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
@media (min-width: 720px) { .wrap { padding: 48px 32px 64px; } }
@media (min-width: 860px) {
  .wrap { max-width: 900px; }
  .pcards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
}

h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; margin: 0 0 12px; }
h2 { font-size: 20px; font-weight: 600; line-height: 1.3; margin: 0 0 16px; }
p { margin: 0; }

.pill-accent { display: block; width: 32px; height: 4px; border-radius: 999px; background: var(--blue); margin: 0 0 14px; }
.lead { font-size: 16px; margin-bottom: 24px; }

.card { background: var(--card); border: 1px solid var(--hair); border-radius: 14px; box-shadow: var(--shadow); padding: 8px 24px; }
.pillar-row { display: flex; gap: 16px; align-items: flex-start; padding: 16px 0; border-top: 1px solid var(--hair); }
.pillar-row:first-child { border-top: 0; }
.picon {
  flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px;
  background: var(--blue-tint); display: flex; align-items: center; justify-content: center;
}
.picon svg { width: 22px; height: 22px; display: block; }
.pillar-name { font-size: 16px; font-weight: 700; line-height: 1.35; margin-bottom: 4px; }
.pillar-desc { font-size: 14px; color: var(--steel); line-height: 1.5; }

.btn {
  display: block; width: 100%; min-height: 52px; margin-top: 24px; padding: 14px 20px;
  border: 0; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer;
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.btn:hover { opacity: 0.92; transform: translateY(-1px); }
.btn:active { transform: scale(0.98); }
.btn-navy { background: var(--navy); color: #FFFFFF; box-shadow: 0 4px 14px rgba(37,59,73,0.18); }
.btn-blue { background: var(--blue); color: #FFFFFF; box-shadow: 0 4px 14px rgba(0,142,255,0.25); }

.link-btn {
  display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px 0 4px;
  background: none; border: 0; color: var(--blue); font-size: 16px; font-weight: 600; cursor: pointer;
  border-radius: 8px; transition: transform 0.15s ease, background-color 0.15s ease;
}
.link-btn:hover { background: var(--blue-tint); }
.link-btn:active { transform: scale(0.98); }
.link-btn svg { width: 20px; height: 20px; display: block; }
.topbar { display: flex; align-items: center; min-height: 44px; margin-bottom: 8px; margin-left: -4px; }

button:focus-visible, .opt:focus-visible { outline: 3px solid rgba(0,142,255,0.45); outline-offset: 2px; }

.track { height: 8px; background: var(--hair); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; background: var(--blue); border-radius: 999px; transition: width 0.2s ease; }
.progress-meta { font-size: 13px; color: var(--steel); margin: 8px 0 28px; }

.pillar-label { font-size: 13px; font-weight: 600; color: var(--blue); letter-spacing: 0.02em; margin-bottom: 8px; }
.question { font-size: 20px; font-weight: 600; line-height: 1.35; margin: 0 0 20px; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; gap: 14px; align-items: flex-start; width: 100%; min-height: 44px; padding: 16px;
  background: var(--card); border: 1px solid var(--hair); border-radius: 12px; text-align: left;
  color: var(--navy); font: inherit; cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}
.opt:hover { background: var(--blue-tint); transform: translateY(-1px); }
.opt:active { transform: scale(0.98); }
.opt.is-sel { background: var(--blue-tint); border-color: var(--blue); }
.radio {
  flex: 0 0 20px; width: 20px; height: 20px; margin-top: 2px; border-radius: 50%;
  border: 2px solid var(--steel); background: var(--card); position: relative;
}
.opt.is-sel .radio { border-color: var(--blue); }
.opt.is-sel .radio::after {
  content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--blue);
}
.opt-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.opt-label { font-size: 16px; font-weight: 700; }
.opt-anchor { font-size: 14px; color: var(--steel); line-height: 1.45; }

.banner {
  background: var(--navy); color: #FFFFFF; border-radius: 14px; padding: 24px; box-shadow: var(--shadow);
}
.banner-label {
  font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  color: rgba(255,255,255,0.8); margin-bottom: 8px;
}
.banner-band { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
.banner-note { margin-top: 12px; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,0.9); }

.section-rule { height: 2px; background: var(--violet); border-radius: 999px; margin: 32px 0 24px; }
.pb-caption { margin: -8px 0 16px; font-size: 14px; color: var(--steel); line-height: 1.5; }

.pcards { display: flex; flex-direction: column; gap: 14px; }
.pcard {
  background: var(--card); border: 1px solid var(--hair); border-radius: 14px; box-shadow: var(--shadow); padding: 24px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.pcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.prow { display: flex; flex-direction: column; gap: 8px; }
.pinfo { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.pname { font-size: 17px; font-weight: 600; line-height: 1.35; }
.ppct { font-size: 36px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
.pnote { margin-top: 12px; font-size: 15px; line-height: 1.5; }
.pnote-label { margin-top: 12px; font-size: 14px; font-weight: 600; }
.recs { margin: 6px 0 0; padding-left: 20px; font-size: 15px; line-height: 1.5; }
.recs li { margin-bottom: 6px; }
.pnote-extra { margin-top: 8px; font-size: 14px; color: var(--steel); line-height: 1.5; }

@media (min-width: 640px) {
  .prow { flex-direction: row; justify-content: space-between; align-items: center; gap: 16px; }
  .ppct { text-align: right; margin-left: auto; }
}

.early { color: var(--steel); }
.developing { color: var(--blue); }
.established { color: var(--green); }
.na { color: var(--steel); }

.badge {
  display: inline-block; padding: 4px 12px; border-radius: 999px;
  font-size: 13px; font-weight: 600; line-height: 1.4;
}
.badge.early { background: var(--steel-tint); color: var(--steel); }
.badge.developing { background: var(--blue-tint); color: var(--blue); }
.badge.established { background: var(--green-tint); color: var(--green); }
.badge.na { background: var(--hair); color: var(--steel); }

.brand-logo { display: block; width: 240px; max-width: 70%; height: auto; margin: 0 0 28px; }

.value-prop { margin: 0 0 24px; font-size: 15px; line-height: 1.5; }
.value-prop p { margin: 0 0 10px; }
.value-prop strong { color: var(--navy); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>

<div class="wrap" id="app"></div>
<form name="ai-governance" method="POST" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="ai-governance">
  <input type="text" name="industry">
  <input type="text" name="overall">
  <input type="text" name="pillars">
  <textarea name="answers"></textarea>
</form>

<script>
const BANDS = ["Early", "Developing", "Established"];

const ICONS = {
  users: '<path d="M8.25 6.75a3.75 3.75 0 1 1 7.5 0 3.75 3.75 0 0 1-7.5 0ZM15.75 9.75a3 3 0 1 1 6 0 3 3 0 0 1-6 0ZM2.25 9.75a3 3 0 1 1 6 0 3 3 0 0 1-6 0ZM6.31 15.117A6.745 6.745 0 0 1 12 12a6.745 6.745 0 0 1 6.709 7.498.75.75 0 0 1-.372.568A12.696 12.696 0 0 1 12 21.75c-2.305 0-4.47-.612-6.337-1.684a.75.75 0 0 1-.372-.568 6.787 6.787 0 0 1 1.019-4.38Z"/>',

  shield: '<path d="M12.516 2.17a.75.75 0 0 0-1.032 0 11.209 11.209 0 0 1-7.877 3.08.75.75 0 0 0-.722.515A12.74 12.74 0 0 0 2.25 9.75c0 5.942 4.064 10.933 9.563 12.348a.749.749 0 0 0 .374 0c5.499-1.415 9.563-6.406 9.563-12.348 0-1.39-.223-2.73-.635-3.985a.75.75 0 0 0-.722-.516l-.143.001c-2.996 0-5.717-1.17-7.734-3.08Z"/>',
  lock: '<path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd"/>',
  cycle: '<path fill-rule="evenodd" d="M4.755 10.059a7.5 7.5 0 0 1 12.548-3.364l1.903 1.903h-3.183a.75.75 0 1 0 0 1.5h4.992a.75.75 0 0 0 .75-.75V4.356a.75.75 0 0 0-1.5 0v3.18l-1.9-1.9A9 9 0 0 0 3.306 9.67a.75.75 0 1 0 1.45.388Zm15.408 3.352a.75.75 0 0 0-.919.53 7.5 7.5 0 0 1-12.548 3.364l-1.902-1.903h3.183a.75.75 0 0 0 0-1.5H2.984a.75.75 0 0 0-.75.75v4.992a.75.75 0 0 0 1.5 0v-3.18l1.9 1.9a9 9 0 0 0 15.059-4.035.75.75 0 0 0-.53-.918Z" clip-rule="evenodd"/>'
};
const CHEVRON_LEFT = '<path fill="#008EFF" d="M15.79 14.77a.75.75 0 0 1-1.06.02l-4.5-4.25a.75.75 0 0 1 0-1.08l4.5-4.25a.75.75 0 1 1 1.04 1.08L11.832 10l3.938 3.71a.75.75 0 0 1 .02 1.06Z"/>';

const PILLARS = [
  { name: "Operating Model", icon: "users",
    intro: "Who owns AI governance, who makes decisions, what policies apply, and who can approve, escalate or stop AI use." },
  { name: "AI Visibility & Inventory", icon: "eye",
    intro: "What AI exists, who owns it, what it's used for, and how unapproved use is found." },
  { name: "Risk & Evaluation", icon: "shield",
    intro: "How AI use is assessed, approved and tested, how people oversee decisions, and when changes trigger review." },
  { name: "Data, Security & Vendors", icon: "lock",
    intro: "How sensitive data is protected, how vendors are vetted, and how AI agent access is controlled." },
  { name: "Lifecycle & Operations", icon: "cycle",
    intro: "How live AI is monitored, how incidents are handled, and how systems can be paused or stopped." }
];

const Q = [
  { p: 0, t: "How established is your organization's AI-use policy?",
    a: ["No written AI-use policy exists.",
        "A policy or guidance exists but is a draft, is not formally approved, or doesn't cover both permitted and prohibited uses.",
        "An approved policy covers permitted uses, prohibited uses, and the exception process, and is published where staff can find it."] },
  { p: 0, t: "Is it clear who is responsible for AI governance and who can make decisions?",
    a: ["No named person or group is responsible for AI governance.",
        "A named owner or committee exists, but its approval authority or its membership across functions is not written down.",
        "A written charter names the owner and the decision rights for approval, rejection, and risk acceptance, covering business, IT, Risk, Legal, and Security."] },
  { p: 0, t: "Does every AI use case have an owner accountable for its risks?",
    a: ["Use cases have no assigned business owner, or owners are assigned only for some.",
        "Some or most AI use cases have owners, but risk responsibilities or approval authority are not clearly documented.",
        "Every use case in the inventory has a named business owner, and each residual-risk acceptance is signed by someone with written authority."] },
  { p: 0, t: "Is it clear who makes the final decision when teams disagree about an AI use case?",
    a: ["Disagreements are settled informally, with no written escalation route.",
        "An escalation process exists, but the final decision-maker is not clearly defined or the process is not consistently followed.",
        "A written route names the final decision-maker for each type of disagreement, and past escalations and their outcomes are recorded."] },

  { p: 1, t: "Do you have a central inventory of AI being used across your organization?",
    a: ["No central list of AI use exists.",
        "A list exists but covers only some teams, or omits either third-party tools or AI features built into existing software.",
        "A central, regularly updated inventory covers internally built AI, third-party tools, embedded AI features, and AI agents."] },
  { p: 1, t: "Does your AI inventory capture the information needed to manage each use case?",
    a: ["Entries are missing, or record only a name.",
        "Entries include some fields, but one or more of owner, purpose, data used, model or provider, deployment status, or risk level is often blank.",
        "Every entry has all six fields filled in: owner, purpose, data used, model or provider, deployment status, and risk level."] },
  { p: 1, t: "Can you identify AI tools being used without approval, rather than relying only on employees to report them?",
    a: ["Unapproved tools are found only when staff report them or someone notices.",
        "Some technical checks exist, such as network or expense reviews, but they don't cover all tools or don't lead to follow-up.",
        "Technical detection runs regularly, and each finding is logged and resolved by approving, restricting, or blocking the tool."] },
  { p: 1, t: "Is your AI inventory updated when systems or how they're used change?",
    a: ["Entries are created once and not updated.",
        "Entries are sometimes updated, but there is no defined process for changes to models, providers, or data sources.",
        "Changes to model, provider, data access, or intended use trigger an update by the named owner, and the update date is recorded."] },

  { p: 2, t: "Are AI use cases assessed for risk before launch, with higher-risk uses receiving more review?",
    a: ["Use cases launch without a risk assessment.",
        "Assessments happen for most use cases, but the depth of review doesn't change with risk level.",
        "Documented risk tiers define required reviews, safeguards, and approvals, which must be completed."] },
  { p: 2, t: "Are AI systems tested for performance and risks before they go live?",
    a: ["Systems go live with little or no testing of performance and risks.",
        "Testing happens, but there are no written pass criteria, or known issues are sometimes launched without sign-off.",
        "Clear pass criteria cover performance and risk, and launches are blocked until critical issues are fixed or formally accepted."] },
  { p: 2, t: "When human oversight is needed, is it clear who reviews AI decisions and when they should intervene?",
    a: ["No human review point is defined for AI decisions.",
        "Reviewers are identified, but when to intervene or who can override AI decisions is not clearly defined.",
        "Clear rules define when human review is required, who can override or stop AI decisions, and how that authority is tested."] },
  { p: 2, t: "Are AI risks reassessed when a system's purpose, model, data access or level of autonomy changes?",
    a: ["Changes are made without a risk review.",
        "Some changes are reviewed, but there are no clear criteria for which changes require reassessment.",
        "Clear criteria require risk reassessment before significant changes, such as a new model, data source, or expanded autonomy, go live."] },

  { p: 3, t: "Are there rules and safeguards to protect sensitive data when using AI tools?",
    a: ["No AI-specific data rules exist.",
        "Rules exist, but they don't name which data types are restricted, or some tools are not covered by them.",
        "Clear rules define restricted data types and approved AI tools, with technical safeguards in place to enforce them."] },
  { p: 3, t: "Are third-party AI tools and AI features in existing software reviewed for data security and vendor risks before use?",
    a: ["Vendors get only a general IT security review.",
        "An AI-specific review exists, but it isn't applied to every tool, or contract terms on training and retention vary by team.",
        "Every AI tool is reviewed for data use, retention, and processing location, with clear contractual protections in place before use."] },
  { p: 3, t: "Are AI agents restricted to approved data, systems and actions?",
    a: ["Agents run with broad or default permissions.",
        "Agents have some permission limits, but the limits aren't reviewed or haven't been tested.",
        "Each agent has clearly defined permissions that are enforced and tested to prevent unauthorized access or actions."] },

  { p: 4, t: "Are AI systems monitored after launch, with clear actions when performance or risks cross acceptable limits?",
    a: ["Systems are monitored only when someone notices a problem.",
        "Metrics are tracked, but thresholds or response owners are missing.",
        "Each system has clear thresholds, a named owner, and defined responses, with breaches and actions taken recorded."] },
  { p: 4, t: "Is there a clear process for reporting, investigating and resolving AI-related incidents?",
    a: ["No AI incident process exists, so issues are handled ad hoc.",
        "Incidents are reported and fixed, but investigations or corrective-action tracking are not consistent.",
        "A defined process covers incident reporting, investigation, and escalation, with corrective actions tracked through resolution."] },
  { p: 4, t: "Can your organization quickly stop or restrict an AI system when needed?",
    a: ["No one is named to stop an AI system, and no procedure exists.",
        "Someone is named, but the procedure has never been tested or the access needed to act is unclear.",
        "A designated person can pause, restrict, or roll back AI systems, and the procedure is regularly tested to ensure it works."] },
  { p: 4, t: "Do you check whether AI governance processes and safeguards are actually working?",
    a: ["Governance activities and safeguards are not checked.",
        "Some reviews happen, but identified gaps are not consistently resolved.",
        "Governance and safeguard checks run on a schedule, each gap is assigned and tracked to closure, and results are reported to leadership."] }
];

const ESTABLISHED_NOTE = "Practices are in place. Keep them current as systems change.";

// Recommendations per question: [rated Early, rated Developing]
const REC = [
  ['Draft and formally approve an AI-use policy that covers permitted uses, prohibited uses, and an exception process.', 'Finalize the AI-use policy, obtain formal approval, and extend it to cover both permitted and prohibited uses.'],
  ['Name one owner for AI governance and set up a group that includes business, IT, Risk, Legal and Security.', 'Establish a charter that defines the owner’s approval authority and the governance group’s membership across functions.'],
  ['Assign a named business owner to every AI use case, starting with those already in production.', 'Record each owner’s risk responsibilities and have every residual-risk acceptance signed by someone with written authority.'],
  ['Document an escalation route for AI disagreements, with a named final decision-maker.', 'Name the final decision-maker for each type of disagreement, and use the escalation route every time.'],
  ['Create one central list of the AI in use across the organization, starting with a survey of each team.', 'Extend the inventory to every team, and include third-party tools, AI features in existing software and AI agents.'],
  ['Set a minimum standard for every inventory entry, starting with owner, purpose, data used, provider, status and risk level.', 'Make owner, purpose, data used, model or provider, deployment status and risk level mandatory for every entry, so no field is left blank.'],
  ['Give staff a simple way to report unapproved tools, and add basic network or expense checks to find them.', 'Run technical checks across all tools, and log and resolve each finding by approving, restricting or blocking it.'],
  ['Assign a named owner to each inventory entry, and review entries on a set schedule.', 'Trigger an update whenever the model, provider, data access or intended use changes, and record the update date.'],
  ['Require a risk assessment before any AI use case launches.', 'Tier the review by risk level so higher-risk uses get more safeguards and approvals, and block launch until the review is complete.'],
  ['Define pre-launch testing for every AI system, starting with performance and risk checks.', 'Set pass criteria for performance and risk, and block launches until critical issues are fixed or formally accepted.'],
  ['Define a human review point for AI decisions that affect customers, employees or money.', 'Define when a human must step in, and give reviewers documented authority to override or stop a system.'],
  ['Require a risk review before any change to an AI system goes live.', 'Define which significant changes, such as a new model, new data source, or expanded autonomy, require reassessment before launch.'],
  ['Publish basic rules on which data may be used with AI tools.', 'Name the restricted data types and approved tools, and back the rules with technical controls such as blocking or DLP.'],
  ['Require an AI-specific review before any vendor tool or embedded AI feature is used.', 'Apply the AI-specific review to every tool, and confirm training and retention terms are in the contract before use.'],
  ['Replace broad default permissions with a written, limited permission list for each agent.', 'Test that each agent blocks out-of-scope actions, and review its permission limits on a set schedule.'],
  ['Set up monitoring for each live system, with a named owner who responds when issues arise.', 'Set written thresholds and a response owner for every metric being tracked.'],
  ['Establish an AI incident process that covers reporting and escalation.', 'Make investigations consistent and track each corrective action through to closure.'],
  ['Name a role that can pause or roll back each AI system, and establish a shutdown procedure.', 'Test the shutdown procedure and confirm the named role has the access needed to act.'],
  ['Schedule regular checks of AI governance processes and safeguards.', 'Track every gap found in these checks to closure and report the results to leadership.']
];

const OVERALL_TEXT = {
  Early: 'Core practices are largely missing or informal. Start with ownership and visibility, because controls are hard to enforce without them.',
  Developing: 'Practices exist in several areas, but gaps in ownership, evidence or enforcement limit how reliably they work. Close these before expanding AI use.',
  Established: 'Practices are documented and in use across the assessed pillars. The priority now is keeping them current as systems change.'
};

const INDUSTRIES = [
  "Financial services",
  "Healthcare and life sciences",
  "Manufacturing and industrials",
  "Retail and consumer goods",
  "Technology and telecommunications",
  "Energy and utilities",
  "Public sector and government",
  "Professional services",
  "Other"
];

let S = {
  screen: "intro",
  q: 0,
  a: Array(Q.length).fill(null),
  industry: null,
  submitted: false
};
let timer = null;
const app = document.getElementById("app");

function icon(name) {
  return '<svg viewBox="0 0 24 24" fill="#008EFF" aria-hidden="true" focusable="false">' + ICONS[name] + '</svg>';
}

function go(screen, q) {
  S.screen = screen;
  if (q !== undefined) S.q = q;
  render();
  window.scrollTo(0, 0);
  const heading = app.querySelector('h1, h2');
  if (heading) { heading.setAttribute('tabindex', '-1'); heading.focus({ preventScroll: true }); }
}

function pick(val) {
  clearTimeout(timer);
  S.a[S.q] = val;
  render();
  timer = setTimeout(function () {
    timer = null;
    if (S.q < Q.length - 1) {
      go("q", S.q + 1);
    } else {
      go("industry");
    }
  }, 180);
}

function back() {
  clearTimeout(timer);
  timer = null;
  if (S.screen === "industry") {
    go("q", Q.length - 1);
    return;
  }
  if (S.screen === "results") {
    go("q", Q.length - 1);
    return;
  }
  if (S.q > 0) {
    go("q", S.q - 1);
  } else {
    go("intro");
  }
}

function retake() {
  clearTimeout(timer);
  timer = null;
  S.a = Array(Q.length).fill(null);
  S.industry = null;
  S.submitted = false;
  go("intro", 0);
}

function scorePillars() {
  return PILLARS.map(function (p, pi) {
    const idx = [];
    for (let i = 0; i < Q.length; i++) if (Q[i].p === pi) idx.push(i);
    const vals = idx.map(function (i) { return S.a[i]; }).filter(function (v) { return typeof v === "number"; });
    const dk = idx.filter(function (i) { return S.a[i] === "dk"; }).length;
    if (vals.length === 0) {
      return { name: p.name, icon: p.icon, pi: pi, assessed: false, dk: dk, pct: null, band: null, capped: false };
    }
    const avg = vals.reduce(function (s, v) { return s + v; }, 0) / vals.length;
    const pct = Math.round((avg - 1) / 2 * 100);
    let band = pct < 35 ? "Early" : (pct < 65 ? "Developing" : "Established");
    let capped = false;
    if (band === "Established" && vals.indexOf(1) !== -1) {
      band = "Developing";
      capped = true;
    }
    return { name: p.name, icon: p.icon, pi: pi, assessed: true, dk: dk, pct: pct, band: band, capped: capped };
  });
}

function overallBand(results) {
  const assessed = results.filter(function (r) { return r.assessed; });
  if (assessed.length === 0) return null;
  const lowest = Math.min.apply(null, assessed.map(function (r) { return BANDS.indexOf(r.band); }));
  return BANDS[lowest];
}

function optionHTML(val, label, anchor, selected) {
  return '<button type="button" class="opt' + (selected ? ' is-sel' : '') + '" role="radio" aria-checked="' + (selected ? 'true' : 'false') + '" data-action="pick" data-val="' + val + '">' +
    '<span class="radio"></span>' +
    '<span class="opt-text"><span class="opt-label">' + label + '</span>' +
    '<span class="opt-anchor">' + anchor + '</span></span>' +
    '</button>';
}

function renderQuestion() {
  const q = Q[S.q];
  const pillar = PILLARS[q.p];
  const current = S.a[S.q];
  const pct = ((S.q + 1) / Q.length) * 100;
  return '<div class="question-screen">' +
    '<div class="topbar"><button type="button" class="link-btn" data-action="back">' +
    '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + CHEVRON_LEFT + '</svg>Back</button></div>' +
    '<div class="track" aria-hidden="true"><div class="fill" style="width:' + pct.toFixed(2) + '%"></div></div>' +
    '<div class="progress-meta" aria-live="polite">Question ' + (S.q + 1) + ' of ' + Q.length + '</div>' +
    '<div class="pillar-label">' + pillar.name + '</div>' +
    '<h2 class="question">' + q.t + '</h2>' +
    '<div class="opts" role="radiogroup" aria-label="' + q.t.replace(/"/g, '&quot;') + '">' +
    optionHTML(1, "Early", q.a[0], current === 1) +
    optionHTML(2, "Developing", q.a[1], current === 2) +
    optionHTML(3, "Established", q.a[2], current === 3) +
    optionHTML("dk", "Don't Know", "Not enough information to answer.", current === "dk") +
    '</div>' +
    '</div>';
}

function bandClass(band) {
  return band ? band.toLowerCase() : "na";
}

function pillarBody(r) {
  if (!r.assessed) {
    return '<p class="pnote">All items in this pillar were marked Don’t Know, so it is excluded from overall results.</p>';
  }
  const items = [];
  for (let i = 0; i < Q.length; i++) {
    if (Q[i].p === r.pi && (S.a[i] === 1 || S.a[i] === 2)) items.push(REC[i][S.a[i] - 1]);
  }
  if (items.length === 0) return '<p class="pnote">' + ESTABLISHED_NOTE + '</p>';
  const label = (r.band === 'Established' && r.pct < 100) ? 'Areas for improvement' : 'Recommended actions';
  return '<p class="pnote-label">' + label + '</p><ul class="recs">' +
    items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>';
}

function renderPillarCard(r) {
  const cls = bandClass(r.band);
  const badgeText = r.assessed ? r.band : "Not assessed";
  const pctText = !r.assessed ? "—" : (r.pct === 100 ? "✓ 100%" : r.pct + "%");
  let extras = "";
  if (r.assessed && r.capped) {
    extras += '<p class="pnote-extra">Capped at Developing: at least one item is Early.</p>';
  }
  if (r.assessed && r.dk > 0) {
    extras += '<p class="pnote-extra">' + r.dk + (r.dk === 1 ? " item was" : " items were") +
      " marked Don't Know and excluded from the score.</p>";
  }
  return '<article class="pcard">' +
    '<div class="prow">' +
    '<div class="pinfo"><span class="picon">' + icon(r.icon) + '</span><span class="pname">' + r.name + '</span>' +
    '<span class="badge ' + cls + '">' + badgeText + '</span></div>' +
    '<div class="ppct ' + cls + '">' + pctText + '</div>' +
    '</div>' +
    pillarBody(r) +
    extras +
    '</article>';
}

function renderResults() {
  const results = scorePillars();
  const overall = overallBand(results);
  const overallText = overall ? overall + " Governance" : "Not assessed";
  return '<div class="results">' +
    '<div class="topbar"><button type="button" class="link-btn" data-action="backq">' +
    '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + CHEVRON_LEFT + '</svg>Back to questions</button></div>' +
    '<span class="pill-accent"></span>' +
    '<h1>Your AI Governance Results</h1>' +
    '<div class="banner">' +
    '<div class="banner-label">Overall maturity</div>' +
    '<div class="banner-band">' + overallText + '</div>' +
    '<p class="banner-note">' + (overall ? OVERALL_TEXT[overall] : 'Answer the questions to see your results.') + '</p>' +
    '</div>' +
    (S.industry ? '<p class="pnote-extra" style="margin-top:12px">Industry: ' + S.industry + '</p>' : '') +
    '<div class="section-rule" aria-hidden="true"></div>' +
    '<h2>Pillar Breakdown</h2>' +
    '<p class="pb-caption">Each percentage reflects average maturity, from Early (0%) to Established (100%), based on answered questions. “Don’t Know” responses are excluded from scoring.</p>' +
    '<div class="pcards">' + results.map(renderPillarCard).join("") + '</div>' +
    '<button type="button" class="btn btn-navy" id="submit-btn" data-action="submit"' + (S.submitted ? ' disabled' : '') + '>' + (S.submitted ? 'Results submitted' : 'Submit results') + '</button>' +
    '<p class="pnote-extra" id="submit-status" role="status">' + (S.submitted ? 'Thank you. Your results have been submitted.' : '') + '</p>' +
    '<button type="button" class="btn btn-blue" data-action="retake">Retake assessment</button>' +
    '</div>';
}

function renderIndustry() {
  const opts = INDUSTRIES.map(function (name, i) {
    const sel = S.industry === name;
    return '<button type="button" class="opt' + (sel ? ' is-sel' : '') + '" role="radio" aria-checked="' + (sel ? 'true' : 'false') + '" data-action="industry" data-val="' + i + '">' +
      '<span class="radio"></span><span class="opt-text"><span class="opt-label">' + name + '</span></span></button>';
  }).join('');
  return '<div class="question-screen">' +
    '<div class="topbar"><button type="button" class="link-btn" data-action="back">' +
    '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + CHEVRON_LEFT + '</svg>Back</button></div>' +
    '<div class="track" aria-hidden="true"><div class="fill" style="width:100%"></div></div>' +
    '<div class="progress-meta" aria-live="polite">Final question</div>' +
    '<div class="pillar-label">About your organization</div>' +
    '<h2 class="question">Which industry does your organization belong to?</h2>' +
    '<div class="opts" role="radiogroup" aria-label="Which industry does your organization belong to?">' + opts + '</div>' +
    '</div>';
}

function submitResults() {
  if (S.submitted) return;
  const btn = document.getElementById("submit-btn");
  const status = document.getElementById("submit-status");
  const results = scorePillars();
  const overall = overallBand(results) || "Not assessed";
  const labels = ["", "Early", "Developing", "Established"];
  const answers = Q.map(function (_, i) {
    const v = S.a[i];
    return "Q" + (i + 1) + "=" + (v === "dk" ? "Don't Know" : (labels[v] || "Unanswered"));
  }).join("; ");
  const pillars = results.map(function (r) {
    return r.name + "=" + (r.assessed ? r.band + " " + r.pct + "%" : "Not assessed");
  }).join("; ");
  const body = new URLSearchParams({
    "form-name": "ai-governance",
    industry: S.industry || "",
    overall: overall,
    pillars: pillars,
    answers: answers
  });
  if (btn) btn.disabled = true;
  if (status) status.textContent = "Submitting…";
  fetch("https://formspree.io/f/xbggjnnn", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded", "Accept": "application/json" },
    body: body.toString()
  }).then(function (res) {
    if (!res.ok) throw new Error("Submission failed");
    S.submitted = true;
    render();
  }).catch(function () {
    if (btn) btn.disabled = false;
    if (status) status.textContent = "Submission failed. Please try again.";
  });
}

function render() {
  let html = "";
  if (S.screen === "intro") html = renderIntro();
  else if (S.screen === "q") html = renderQuestion();
  else if (S.screen === "industry") html = renderIndustry();
  else html = renderResults();
  app.innerHTML = html;
}

app.addEventListener("click", function (e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");
  if (action === "start") {
    go("q", S.q);
  } else if (action === "pick") {
    const raw = el.getAttribute("data-val");
    pick(raw === "dk" ? "dk" : Number(raw));
  } else if (action === "industry") {
    S.industry = INDUSTRIES[Number(el.getAttribute("data-val"))];
    render();
    clearTimeout(timer);
    timer = setTimeout(function () { timer = null; go("results"); }, 180);
  } else if (action === "back") {
    back();
  } else if (action === "backq") {
    go("q", Q.length - 1);
  } else if (action === "submit") {
    submitResults();
  } else if (action === "retake") {
    retake();
  }
});

document.addEventListener('keydown', function (e) {
  if (S.screen !== 'q') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
  else if (e.key === 'ArrowRight' && S.a[S.q] !== null) {
    e.preventDefault();
    clearTimeout(timer); timer = null;
    if (S.q < Q.length - 1) go('q', S.q + 1); else go('industry');
  }
});

render();
</script>
</body>
</html>
